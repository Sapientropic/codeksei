name: Publish to npm

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run verify

      - name: Run production audit gate
        run: npm run audit:prod

      - name: Run strict lib checks
        run: npm run typecheck:strict-libs

      - name: Run installed-package smoke
        run: npm run smoke:package

      - name: Resolve package metadata
        id: package_meta
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches package version
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          package_version="${{ steps.package_meta.outputs.version }}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${package_version}" != "${tag_version}" ]; then
            echo "package.json version ${package_version} does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check whether this version already exists on npm
        if: ${{ github.event_name == 'release' }}
        id: npm_version_check
        shell: bash
        run: |
          package_ref="${{ steps.package_meta.outputs.name }}@${{ steps.package_meta.outputs.version }}"
          tmp_err="$(mktemp)"
          if npm view "${package_ref}" version >/dev/null 2>"${tmp_err}"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${package_ref} already exists on npm; publish step will be skipped."
            exit 0
          fi
          if grep -Eqi "E404|Not Found|not found" "${tmp_err}"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "${tmp_err}" >&2
          exit 1

      - name: Dry-run publish preflight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm publish --dry-run --access public

      - name: Skip publish because version already exists
        if: ${{ github.event_name == 'release' && steps.npm_version_check.outputs.already_published == 'true' }}
        run: echo "Skipping npm publish because this version already exists."

      - name: Publish package
        if: ${{ github.event_name == 'release' && steps.npm_version_check.outputs.already_published != 'true' }}
        run: npm publish --access public
